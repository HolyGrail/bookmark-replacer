<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark Replacer 設定</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Bookmark Replacer</h1>
      <p class="lead">
        アイコンクリックで URL を上書きする対象のブックマークを 1 件選択してください。
      </p>

      <section class="current">
        <h2>現在の設定</h2>
        <p id="current-display" class="current-display">読み込み中…</p>
      </section>

      <section class="picker">
        <h2>ブックマークを選択</h2>
        <input
          id="search"
          type="search"
          placeholder="タイトル・URL で絞り込み"
          autocomplete="off"
        />
        <ul id="bookmark-list" class="bookmark-list" aria-label="ブックマーク一覧"></ul>
        <p id="empty-state" class="empty-state" hidden>該当するブックマークがありません</p>
      </section>

      <section class="actions">
        <button id="save" type="button" disabled>選択したブックマークを保存</button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
