<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="optionsTitle">Bookmark Replacer Settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Bookmark Replacer</h1>
      <p class="lead" data-i18n="optionsLead"></p>

      <section class="current">
        <h2 data-i18n="currentHeading"></h2>
        <p id="current-display" class="current-display" data-i18n="loading"></p>
      </section>

      <section class="picker">
        <h2 data-i18n="pickerHeading"></h2>
        <input
          id="search"
          type="search"
          data-i18n-placeholder="searchPlaceholder"
          autocomplete="off"
        />
        <ul id="bookmark-list" class="bookmark-list" data-i18n-aria-label="bookmarkListLabel"></ul>
        <p id="empty-state" class="empty-state" hidden data-i18n="emptyState"></p>
      </section>

      <section class="actions">
        <button id="save" type="button" disabled data-i18n="saveButton"></button>
        <span id="status" class="status" role="status" aria-live="polite"></span>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
